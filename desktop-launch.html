<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skirmish Arena</title>
  <style>
    html{color-scheme:dark;background:#15251e;color:#ecece2;font:15px "Segoe UI",system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(34rem,calc(100vw - 64px));padding:30px 0;border-top:3px solid #879d72;border-bottom:1px solid #415747}h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:0 0 18px}p{line-height:1.55;color:#b5c4b7;min-height:46px}button{font:inherit;font-weight:650;padding:10px 18px;color:#ecece2;background:#294434;border:1px solid #637e60;border-radius:4px;cursor:pointer;transition:background .15s}button:hover{background:#365741}button:focus-visible{outline:2px solid #bed0a8;outline-offset:3px}[hidden]{display:none}
  </style>
</head>
<body>
  <main aria-live="polite"><h1>SKIRMISH ARENA</h1><p id="status">Preparing the installed release…</p><button id="retry" hidden>Retry</button></main>
  <script src="./desktop-launch.js"></script>
</body>
</html>
